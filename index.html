<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Video Downloader (Zaid Alam)</h1>
        <input type="text" id="videoUrl" placeholder="Enter YouTube Video URL">
        <button onclick="downloadVideo()">Download</button>
        <p id="message"></p>
    </div>

    <script>
        async function downloadVideo() {
            const videoUrl = document.getElementById('videoUrl').value;
            const message = document.getElementById('message');

            if (!videoUrl) {
                message.textContent = "Please enter a valid YouTube URL.";
                return;
            }

            message.textContent = "Downloading...";

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(videoUrl)}`,
                });

                if (response.ok) {
                    const result = await response.json();
                    message.textContent = `Download complete: ${result.title}`;
                    document.getElementById('videoUrl').value = '';  // Reset the input field
                } else {
                    message.textContent = "Failed to download the video.";
                }
            } catch (error) {
                message.textContent = "An error occurred. Please try again.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
